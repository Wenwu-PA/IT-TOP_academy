&amp;gt;&amp;lt;font style=&amp;quot;font-size:20px;&amp;quot;&amp;gt;СИЛЬНЫЕ СТОРОНЫ&amp;lt;/font&amp;gt;&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;&amp;lt;span style=&amp;quot;background-color: transparent; color: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));&amp;quot;&amp;gt;• Опыт работы с Linux и сетевым оборудованием&amp;lt;/span&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;&amp;lt;span style=&amp;quot;background-color: transparent; color: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));&amp;quot;&amp;gt;• Опыт настройки OpenWrt и домашней сети&amp;lt;/span&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;&amp;lt;span style=&amp;quot;background-color: transparent; color: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));&amp;quot;&amp;gt;• Понимание Docker, VPN и сетевых сервисов&amp;lt;/span&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;&amp;lt;span style=&amp;quot;background-color: transparent; color: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));&amp;quot;&amp;gt;• Возможность самостоятельно администрировать сервер&amp;lt;/span&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;&amp;lt;span style=&amp;quot;background-color: transparent; color: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));&amp;quot;&amp;gt;• Уже существующая домашняя инфраструктура&amp;lt;/span&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;390\&quot; width=\&quot;480\&quot; x=\&quot;80\&quot; y=\&quot;110\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;TcE6iXMKKNYPnphZGmUo-4\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;weaknesses\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;entryX=1;entryY=0.5;entryDx=0;entryDy=0;\&quot; target=\&quot;strengths\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;weaknesses\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#fff3e0;strokeColor=#fb8c00;strokeWidth=2;align=left;verticalAlign=top;spacingTop=18;spacingLeft=18;spacingRight=18;fontSize=14;\&quot; value=\&quot;&amp;lt;b&amp;gt;&amp;lt;font style=&amp;quot;font-size:20px;&amp;quot;&amp;gt;СЛАБЫЕ СТОРОНЫ&amp;lt;/font&amp;gt;&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;• Недостаток современных комплектующих&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;• Недостаточное количество накопителей&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;• Ограниченный бюджет на покупку оборудования&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;• Нет готовой серверной платформы&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;• Ограниченные возможности масштабирования хранилища\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;390\&quot; width=\&quot;480\&quot; x=\&quot;610\&quot; y=\&quot;110\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;TcE6iXMKKNYPnphZGmUo-6\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;opportunities\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;\&quot; target=\&quot;threats\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;opportunities\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#e3f2fd;strokeColor=#1e88e5;strokeWidth=2;align=left;verticalAlign=top;spacingTop=18;spacingLeft=18;spacingRight=18;fontSize=14;\&quot; value=\&quot;&amp;lt;b&amp;gt;&amp;lt;font style=&amp;quot;font-size:20px;&amp;quot;&amp;gt;ВОЗМОЖНОСТИ&amp;lt;/font&amp;gt;&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;• Использовать сервер не только для медиатеки&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;• Развернуть Minecraft, Mumble, NetBird и другие сервисы&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;• Постепенно докупать диски и модернизировать оборудование&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;• Получить практический опыт Linux и системного администрирования&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;• Создать собственное централизованное хранилище\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;390\&quot; width=\&quot;480\&quot; x=\&quot;80\&quot; y=\&quot;530\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;TcE6iXMKKNYPnphZGmUo-7\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;threats\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;\&quot; target=\&quot;weaknesses\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;threats\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#fce4ec;strokeColor=#e53935;strokeWidth=2;align=left;verticalAlign=top;spacingTop=18;spacingLeft=18;spacingRight=18;fontSize=14;\&quot; value=\&quot;&amp;lt;b&amp;gt;&amp;lt;font style=&amp;quot;font-size:20px;&amp;quot;&amp;gt;УГРОЗЫ&amp;lt;/font&amp;gt;&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;• Выход из строя накопителя может привести к потере данных&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;• Рост объёма медиаданных потребует новых дисков&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;• Слабое оборудование может не справляться&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;• Рост энергопотребления при использовании более мощного оборудования&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;• Отказ одного компонента может вывести сервер из строя\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;390\&quot; width=\&quot;480\&quot; x=\&quot;610\&quot; y=\&quot;530\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;TcE6iXMKKNYPnphZGmUo-3\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;conclusion\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;\&quot; target=\&quot;TcE6iXMKKNYPnphZGmUo-1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;conclusion\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#f5f5f5;strokeColor=#616161;strokeWidth=2;align=center;verticalAlign=middle;fontSize=14;spacing=15;\&quot; value=\&quot;&amp;lt;b&amp;gt;ВЫВОД&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;Начать с доступного оборудования и минимальной конфигурации, используя имеющийся опыт работы с Linux и сетями. В дальнейшем постепенно расширять дисковое пространство и модернизировать серверное оборудование.\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;130\&quot; width=\&quot;670\&quot; x=\&quot;250\&quot; y=\&quot;950\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;TcE6iXMKKNYPnphZGmUo-2\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;\&quot; value=\&quot;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;260\&quot; width=\&quot;850\&quot; x=\&quot;155\&quot; y=\&quot;1140\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;TcE6iXMKKNYPnphZGmUo-9\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;TcE6iXMKKNYPnphZGmUo-1\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;entryX=0.5;entryY=0;entryDx=0;entryDy=0;\&quot; target=\&quot;TcE6iXMKKNYPnphZGmUo-8\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;TcE6iXMKKNYPnphZGmUo-1\&quot; parent=\&quot;1\&quot; style=\&quot;text;whiteSpace=wrap;html=1;\&quot; value=\&quot;&amp;lt;p&amp;gt;&amp;lt;strong&amp;gt;&amp;lt;font style=&amp;quot;font-size: 20px;&amp;quot;&amp;gt;Моя SMART-цель&amp;lt;/font&amp;gt;&amp;lt;/strong&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;&amp;lt;font style=&amp;quot;font-size: 20px;&amp;quot;&amp;gt;До &amp;lt;strong style=&amp;quot;&amp;quot;&amp;gt;31 декабря 2026 года&amp;lt;/strong&amp;gt; собрать и запустить &amp;lt;strong style=&amp;quot;&amp;quot;&amp;gt;домашний медиасервер&amp;lt;/strong&amp;gt; на доступном оборудовании, настроить централизованное хранение и воспроизведение медиаданных по локальной сети, а также развернуть &amp;lt;strong style=&amp;quot;&amp;quot;&amp;gt;не менее 3 дополнительных сервисов&amp;lt;/strong&amp;gt; для домашней инфраструктуры. Сервер должен иметь возможность дальнейшего расширения дискового пространства и модернизации оборудования.&amp;lt;/font&amp;gt;&amp;lt;/p&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;240\&quot; width=\&quot;840\&quot; x=\&quot;165\&quot; y=\&quot;1160\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;TcE6iXMKKNYPnphZGmUo-8\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;align=left;\&quot; value=\&quot;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;500\&quot; width=\&quot;890\&quot; x=\&quot;140\&quot; y=\&quot;1470\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;TcE6iXMKKNYPnphZGmUo-11\&quot; parent=\&quot;1\&quot; style=\&quot;text;whiteSpace=wrap;html=1;\&quot; value=\&quot;&amp;lt;p&amp;gt;&amp;lt;span style=&amp;quot;font-size: 20px; background-color: transparent; color: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));&amp;quot;&amp;gt;&amp;lt;strong&amp;gt;Задачи:&amp;lt;/strong&amp;gt;&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span style=&amp;quot;font-size: 20px;&amp;quot;&amp;gt;1 - выяснить причину несовместимости современной ОС и стандартного способа установки ОС(24.09-25.09) - выполнено! &amp;lt;font style=&amp;quot;color: light-dark(rgb(0, 0, 0), rgb(255, 233, 0));&amp;quot;&amp;gt;(ограничение проприетарной технологии DELL на уровне железа, 32 битная и старый 64 разрядный стандарт команд для процессора)&amp;lt;/font&amp;gt;&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span style=&amp;quot;font-size: 20px;&amp;quot;&amp;gt;2 - выяснить, где есть возможность получить железо лучше нынешнего (28.09-30-09) - выполнено! &amp;lt;font style=&amp;quot;color: light-dark(rgb(0, 0, 0), rgb(255, 165, 0));&amp;quot;&amp;gt;(На работе есть списанное железо)&amp;lt;/font&amp;gt;&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span style=&amp;quot;font-size: 20px;&amp;quot;&amp;gt;3 -&amp;amp;nbsp;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;font-size: 20px; background-color: transparent; color: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));&amp;quot;&amp;gt;установить 32 bit-ный iso образ на hdd используя пк друга (28.09-29.09) - в процессе&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span style=&amp;quot;font-size: 20px; background-color: transparent; color: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));&amp;quot;&amp;gt;4 - выяснить возможности нынешней сборки с установленной системой (стоит ли дальше развивать его, или проще собрать из нового?)(30.09-2.09)&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;465\&quot; width=\&quot;855\&quot; x=\&quot;157.5\&quot; y=\&quot;1487.5\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;&quot;,&quot;toolbar&quot;:&quot;pages zoom layers lightbox&quot;,&quot;page&quot;:0}"></div>
